name: Release macOS DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: Scan committed files for secrets
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          SCAN_DIR="$(mktemp -d "$RUNNER_TEMP/scan.XXXXXX")"
          git archive HEAD | tar -x -C "$SCAN_DIR"
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner "$SCAN_DIR"
      - name: Build verified FFmpeg helpers
        run: bash Scripts/build-ffmpeg.sh
      - name: Test
        run: swift test
      - name: Package and verify release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash Scripts/package-release.sh "$RELEASE_TAG" "$BUILD_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: build/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release-assets
        run: |
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true || { echo 'Release is already published; refusing to replace it.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Media Converter $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg ./*-sources.tar.gz SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
